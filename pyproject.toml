[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenbudget"
version = "0.1.0"
description = "How visual-token budget changes what an edge MLLM can see"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
]

[project.optional-dependencies]
gpu = [
    "transformers>=5.7",
    "torch>=2.3",
    "safetensors",
    "accelerate",
]
paper = [
    "matplotlib",
    "markdown",
]
ui = [
    "fastapi",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
